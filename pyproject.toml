[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aula-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar Moodle (Aula USM) desde Claude u otros asistentes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro" }]
keywords = ["mcp", "moodle", "claude", "usm", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pypdf>=5",
]

[project.urls]
Repository = "https://github.com/muitomou/moodle-mcp-aula-usm"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aula-mcp = "aula_mcp.server:main"
aula-mcp-login = "aula_mcp.cli:login"
aula-mcp-check = "aula_mcp.cli:check"
aula-mcp-desktop = "aula_mcp.cli:desktop"

[tool.hatch.build.targets.wheel]
packages = ["src/aula_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
