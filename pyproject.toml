[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aula-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar Moodle (Aula USM) desde Claude u otros asistentes compatibles con MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Castillo Lackington" }]
keywords = ["mcp", "moodle", "claude", "usm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pypdf>=5",
]

[project.urls]
Repository = "https://github.com/muitomou/moodle-mcp-aula-usm"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
aula-mcp = "aula_mcp.server:main"
aula-mcp-login = "aula_mcp.cli:login"
aula-mcp-check = "aula_mcp.cli:check"
aula-mcp-desktop = "aula_mcp.cli:desktop"

[tool.hatch.build.targets.wheel]
packages = ["src/aula_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aula_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # pyflakes
    "I",   # orden de imports
    "B",   # bugbear
    "UP",  # sintaxis moderna
    "SIM", # simplificaciones
]
# Las líneas largas que quedan son textos para el usuario; el formateador se encarga del resto.
# SIM108: un if/else de varias líneas se lee mejor que un ternario largo.
ignore = ["E501", "SIM108"]
